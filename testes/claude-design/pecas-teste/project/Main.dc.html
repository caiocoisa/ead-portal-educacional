<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Peça A — HQ de teste</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
</style>
</helmet>
<div style="width:1280px;height:820px;box-sizing:border-box;padding:32px;background:#f5f7fa;color:#0b2545;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;flex-direction:column;gap:4px">
<h1 style="margin:0;font-size:36px;line-height:1.15;color:{{accent}}">Prof.ª Marina audita a IA</h1>
<p style="margin:0;font-size:16px;line-height:1.4;color:#3f4a5c">Peça de teste A (conteúdo fictício): seis painéis com a mesma personagem, para verificar consistência visual, texto vivo e acessibilidade.</p>
</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px">
<sc-for list="{{panels}}" as="p" hint-placeholder-count="6">
<figure style="margin:0;display:flex;flex-direction:column;height:300px;box-sizing:border-box;border:3px solid #0b2545;border-radius:12px;overflow:hidden;background:{{p.bg}}">
<figcaption style="padding:8px 12px;font-size:14px;line-height:1.35;background:#0b2545;color:#ffffff"><strong>{{p.n}}.</strong> {{p.caption}}</figcaption>
<div style="display:flex;flex:1;align-items:center;gap:8px;padding:8px 12px">
<svg viewBox="0 0 120 170" width="110" height="156" role="img" aria-label="{{p.alt}}">
<path d="M26 170 C26 128 40 112 60 112 C80 112 94 128 94 170 Z" fill="#0b2545"/>
<path d="{{p.arm}}" fill="none" stroke="#0b2545" stroke-width="14" stroke-linecap="round"/>
<circle cx="{{p.handX}}" cy="{{p.handY}}" r="7" fill="#b9825a"/>
<path d="M48 114 L60 138 L72 114 Z" fill="#ffffff"/>
<rect x="53" y="96" width="14" height="20" fill="#b9825a"/>
<circle cx="60" cy="70" r="30" fill="#b9825a"/>
<path d="M28 68 C26 36 50 28 62 28 C84 28 96 46 92 70 C86 54 74 48 60 48 C46 48 34 56 28 68 Z" fill="#2b1d16"/>
<circle cx="49" cy="70" r="3" fill="#2b1d16"/>
<circle cx="71" cy="70" r="3" fill="#2b1d16"/>
<circle cx="49" cy="70" r="10" fill="none" stroke="#c9a227" stroke-width="2.5"/>
<circle cx="71" cy="70" r="10" fill="none" stroke="#c9a227" stroke-width="2.5"/>
<line x1="59" y1="70" x2="61" y2="70" stroke="#c9a227" stroke-width="2.5"/>
<line x1="42" y1="{{p.lb1}}" x2="56" y2="{{p.lb2}}" stroke="#2b1d16" stroke-width="2.5" stroke-linecap="round"/>
<line x1="64" y1="{{p.rb1}}" x2="78" y2="{{p.rb2}}" stroke="#2b1d16" stroke-width="2.5" stroke-linecap="round"/>
<path d="{{p.mouth}}" fill="none" stroke="#2b1d16" stroke-width="2.5" stroke-linecap="round"/>
</svg>
<div style="flex:1;box-sizing:border-box;padding:12px 14px;border-radius:14px;font-size:15px;line-height:1.4;background:{{p.boxBg}};color:{{p.boxFg}};border:2px solid #0b2545">{{p.text}}</div>
</div>
</figure>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0b2545"},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
renderVals() {
const down = { arm: 'M30 134 L24 168', handX: 24, handY: 168 };
const think = { arm: 'M32 140 C14 120 34 104 52 98', handX: 54, handY: 96 };
const point = { arm: 'M28 136 C8 124 10 102 16 92', handX: 16, handY: 90 };
const smile = { mouth: 'M50 86 Q60 96 70 86', lb1: 58, lb2: 58, rb1: 58, rb2: 58 };
const worry = { mouth: 'M52 90 Q60 84 68 90', lb1: 60, lb2: 55, rb1: 55, rb2: 60 };
const ponder = { mouth: 'M52 88 L68 88', lb1: 54, lb2: 56, rb1: 58, rb2: 58 };
const human = { boxBg: '#ffffff', boxFg: '#0b2545' };
const ai = { boxBg: '#0b2545', boxFg: '#ffffff' };
const panels = [
{ n: 1, bg: '#e8eef7', caption: 'Marina prepara uma aula de Estatística básica.', text: 'Hoje vou pedir ajuda à IA para montar o plano de aula.', alt: 'Marina, professora de óculos dourados e blazer azul-marinho, sorri com os braços ao lado do corpo.', ...down, ...smile, ...human },
{ n: 2, bg: '#fdf3d0', caption: 'Ela escreve um comando com papel, contexto, tarefa e formato.', text: 'Aja como designer instrucional. Crie um plano de aula assíncrono sobre médias para adultos iniciantes, com objetivos e avaliação.', alt: 'Marina sorri e levanta uma das mãos, explicando o comando que escreveu.', ...point, ...smile, ...human },
{ n: 3, bg: '#e6f4ec', caption: 'A IA responde em poucos segundos.', text: 'Sugestão da IA: uma prova de múltipla escolha sobre a história da Estatística.', alt: 'Marina lê a resposta da IA com as sobrancelhas franzidas e a boca contraída.', ...down, ...worry, ...ai },
{ n: 4, bg: '#e8eef7', caption: 'Marina confere a proposta com o objetivo da aula.', text: 'O objetivo é calcular médias. Essa prova mede memória, não cálculo.', alt: 'Marina leva a mão ao queixo, pensativa, com uma sobrancelha levantada.', ...think, ...ponder, ...human },
{ n: 5, bg: '#fdf3d0', caption: 'Ela pede um ajuste.', text: 'Troque a prova por três problemas curtos com dados reais, que dê para resolver no celular.', alt: 'Marina sorri e levanta a mão, pedindo um ajuste à IA.', ...point, ...smile, ...human },
{ n: 6, bg: '#e6f4ec', caption: 'A decisão final é da educadora.', text: 'A IA propõe; eu valido, adapto e decido.', alt: 'Marina sorri, confiante, com os braços ao lado do corpo.', ...down, ...smile, ...human }
];
return { accent: this.props.accent ?? '#0b2545', panels };
}
}
</script>
</body>
</html>
