<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Peça B — Mapa interativo de teste</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button{font-family:inherit}
button:focus-visible{outline:3px solid #0b2545;outline-offset:3px}
</style>
</helmet>
<div style="width:1000px;height:640px;box-sizing:border-box;padding:32px;background:#f5f7fa;color:#0b2545;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;flex-direction:column;gap:4px">
<h1 style="margin:0;font-size:32px;line-height:1.15">Mapa do alinhamento pedagógico</h1>
<p style="margin:0;font-size:16px;line-height:1.4;color:#3f4a5c">Peça de teste B (conteúdo fictício): escolha um elemento para ver o conceito, um exemplo e a falha típica que uma IA comete.</p>
</div>
<div style="display:flex;flex:1;min-height:0;gap:24px">
<div role="group" aria-label="Elementos do alinhamento" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:400px;align-content:start">
<sc-for list="{{nodes}}" as="node" hint-placeholder-count="4">
<button type="button" onClick="{{ node.pick }}" aria-pressed="{{ node.pressed }}" style="display:flex;flex-direction:column;align-items:flex-start;gap:6px;box-sizing:border-box;min-height:120px;padding:16px;border-radius:14px;cursor:pointer;text-align:left;border:3px solid #0b2545;background:{{node.bg}};color:{{node.fg}}">
<span style="font-size:14px;font-weight:600">{{node.n}}</span>
<span style="font-size:22px;font-weight:700;line-height:1.2">{{node.title}}</span>
</button>
</sc-for>
</div>
<section aria-live="polite" style="flex:1;box-sizing:border-box;padding:24px 28px;border-radius:14px;background:#ffffff;border:3px solid #0b2545;display:flex;flex-direction:column;gap:14px">
<h2 style="margin:0;font-size:26px;line-height:1.2">{{detail.title}}</h2>
<div>
<h3 style="margin:0 0 4px 0;font-size:14px;letter-spacing:0.04em;text-transform:uppercase;color:#3f4a5c">Conceito</h3>
<p style="margin:0;font-size:17px;line-height:1.45">{{detail.concept}}</p>
</div>
<div>
<h3 style="margin:0 0 4px 0;font-size:14px;letter-spacing:0.04em;text-transform:uppercase;color:#3f4a5c">Exemplo</h3>
<p style="margin:0;font-size:17px;line-height:1.45">{{detail.example}}</p>
</div>
<div style="padding:12px 14px;border-radius:10px;background:#fdf3d0;border:2px solid #0b2545">
<h3 style="margin:0 0 4px 0;font-size:14px;letter-spacing:0.04em;text-transform:uppercase">Falha típica da IA</h3>
<p style="margin:0;font-size:17px;line-height:1.45">{{detail.failure}}</p>
</div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":640}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sel: 0 };
}
renderVals() {
const data = [
{ title: 'Público', concept: 'Quem aprende: perfil, tempo disponível e dispositivo de acesso.', example: 'Adultos que estudam à noite, pelo celular.', failure: 'Sugere uma atividade que exige um computador potente.' },
{ title: 'Objetivos', concept: 'O que o aluno deverá ser capaz de fazer ao final.', example: 'Calcular a média de um conjunto de dados.', failure: 'Lista objetivos vagos, como "entender Estatística".' },
{ title: 'Atividades', concept: 'A prática que leva o aluno até o objetivo.', example: 'Resolver três problemas curtos com dados reais.', failure: 'Propõe leitura longa, sem nenhuma prática.' },
{ title: 'Avaliação', concept: 'A evidência de que o objetivo foi atingido.', example: 'Um mini-problema de cálculo, com gabarito comentado.', failure: 'Sugere uma prova de memorização que não mede o objetivo.' }
];
const sel = this.state.sel;
const nodes = data.map((d, i) => ({
n: 'Elemento ' + (i + 1),
title: d.title,
pressed: sel === i,
bg: sel === i ? '#0b2545' : '#ffffff',
fg: sel === i ? '#ffffff' : '#0b2545',
pick: () => this.setState({ sel: i })
}));
return { nodes, detail: data[sel] };
}
}
</script>
</body>
</html>
